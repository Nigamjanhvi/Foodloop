services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: foodloop
      POSTGRES_USER: foodloop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodloop_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - foodloop_pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodloop -d foodloop"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  foodloop_pgdata:
